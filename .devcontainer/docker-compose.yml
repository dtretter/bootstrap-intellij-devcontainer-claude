name: PROJEKTNAME-devcontainer  # TODO: pro Projekt eindeutigen Namen setzen

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # UID/GID des Host-Users, damit Dateien im gemounteten Workspace ihm gehören.
        # Kommen aus der Host-Umgebung (z. B. `export USER_UID=$(id -u)` in ~/.bashrc)
        # oder aus .devcontainer/.env. Fehlen sie, wird STILL 1000 verwendet.
        # Änderungen greifen erst nach Rebuild (`dvc re`).
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
    volumes:
      - ..:/workspace:cached
      - claude-config:/home/dev/.claude
    environment:
      # Langlebiger OAuth-Token vom Host (per `claude setup-token` erzeugt).
      # Wert kommt aus .devcontainer/.env (gitignored) oder der Host-Umgebung.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
    command: sleep infinity
    cap_drop: ["ALL"]
    cap_add: ["NET_ADMIN", "NET_RAW", "SETUID", "SETGID", "AUDIT_WRITE"]
    networks: [devnet]
    # Projektspezifische Services und Umgebungsvariablen werden von Claude hier ergänzt,
    # z. B.: environment, depends_on

  # Projektspezifische Services (Datenbank, Cache, etc.) werden von Claude hier ergänzt.

networks:
  devnet:

volumes:
  claude-config:
